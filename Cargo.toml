[package]
name = "pg_profiler"
version = "0.2.0"
edition = "2021"
description = "Per-execution query tracing for PostgreSQL"
license = "MIT OR BSD-3-Clause OR Apache-2.0 OR PostgreSQL"
repository = "https://github.com/majorsilence/PostgreProfiler"

[lib]
crate-type = ["cdylib"]

[features]
default = ["pg18"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17" ]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18" ]
pg19 = ["pgrx/pg19", "pgrx-tests/pg19" ]
pg_test = []
pg_bench = ["dep:pgrx-bench"]

[dependencies]
pgrx = "=0.20.0"
libc = "0.2"
serde_json = "1"

[dependencies.pgrx-bench]
version = "=0.20.0"
optional = true

[dev-dependencies]
[dev-dependencies.pgrx-tests]
version = "=0.20.0"

[profile.dev]
panic = "unwind"

[profile.dev.build-override]
opt-level = 3

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
