services:
  # Rust + pgrx toolchain. Source is bind-mounted; cargo caches live in volumes.
  #   docker compose run --rm builder cargo pgrx test pg18
  #   docker compose run --rm builder cargo clippy -- -D warnings
  builder:
    build:
      context: .
      target: toolchain
    working_dir: /src
    volumes:
      - .:/src
      - cargo-registry:/home/dev/.cargo/registry
      - cargo-target:/src/target
      - pgrx-data:/home/dev/.pgrx
    command: ["bash"]
    profiles: ["tools"]

  # Postgres with the compiled extension installed and preloaded.
  #   docker compose up --build db            (PostgreSQL 18)
  #   PG_MAJOR=19 docker compose up --build db  (17, 18 or 19)
  #   psql postgres://postgres:postgres@localhost:5432/postgres
  db:
    build:
      context: .
      target: postgres
      args:
        PG_MAJOR: ${PG_MAJOR:-18}
    # Short statistics intervals make the archive visible quickly (scripts/e2e-archive.sh).
    command: ["postgres", "-c", "shared_preload_libraries=pg_profiler", "-c", "pg_profiler.stats_interval=${PG_PROFILER_STATS_INTERVAL:-300}"]
    environment:
      POSTGRES_PASSWORD: postgres   # local development only
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql   # postgres:18+ keeps data in a versioned subdirectory

volumes:
  cargo-registry:
  cargo-target:
  pgrx-data:
  pgdata:
