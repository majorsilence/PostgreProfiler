[target.'cfg(target_os="macos")']
# Postgres symbols won't be available until runtime
rustflags = ["-Clink-arg=-Wl,-undefined,dynamic_lookup"]

# The tests share one server and global state (the ring buffers, reset), so a
# concurrent pg_profiler_reset() in one test can hide another test's rows.
[env]
RUST_TEST_THREADS = "1"
